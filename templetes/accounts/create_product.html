<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Product — VideoSnap Shop</title>
    <meta name="description" content="Add a new product to the VideoSnap shop.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0c14;
            --surface: rgba(255,255,255,0.04);
            --surface-hover: rgba(255,255,255,0.07);
            --border: rgba(255,255,255,0.08);
            --border-focus: rgba(108,99,255,0.55);
            --accent: #6c63ff;
            --accent2: #a78bfa;
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --radius: 16px;
            --radius-sm: 10px;
            --input-bg: rgba(255,255,255,0.05);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                radial-gradient(ellipse 80% 50% at 20% 10%, rgba(108,99,255,0.15) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(167,139,250,0.10) 0%, transparent 60%);
        }

        /* Navbar */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            height: 68px;
            background: rgba(10,12,20,0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .navbar-brand {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }
        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-back:hover { background: var(--surface-hover); transform: translateY(-1px); }

        /* Main layout */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 20px;
        }

        .form-card {
            width: 100%;
            max-width: 560px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px;
            backdrop-filter: blur(12px);
            box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }

        .form-header { margin-bottom: 32px; }
        .form-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.8px;
            line-height: 1.2;
        }
        .form-header h1 span {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .form-header p {
            margin-top: 6px;
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Form fields */
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-label svg { color: var(--accent2); flex-shrink: 0; }
        .form-label .required { color: #ef4444; margin-left: 2px; }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .form-control::placeholder { color: rgba(148,163,184,0.4); }
        .form-control:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
            background: rgba(255,255,255,0.07);
        }
        textarea.form-control { resize: vertical; min-height: 100px; line-height: 1.6; }

        /* Row layout */
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* File upload */
        .file-upload-wrap { position: relative; }
        .file-upload-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px dashed rgba(108,99,255,0.35);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            color: var(--text-muted);
        }
        .file-upload-label:hover {
            border-color: var(--accent);
            background: rgba(108,99,255,0.06);
            color: var(--text);
        }
        .file-upload-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: rgba(108,99,255,0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent2);
        }
        input[type="file"] {
            position: absolute;
            width: 0.1px;
            height: 0.1px;
            opacity: 0;
            overflow: hidden;
        }
        .file-upload-text { font-size: 13px; line-height: 1.4; }
        .file-upload-text strong { display: block; color: var(--text); font-weight: 600; }

        /* Image preview */
        .image-preview {
            display: none;
            margin-top: 12px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            border: 1px solid var(--border);
        }
        .image-preview img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            display: block;
        }
        .image-preview.visible { display: block; }

        /* Submit button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.2px;
        }
        .btn-submit:hover {
            opacity: 0.88;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(108,99,255,0.4);
        }
        .btn-submit:active { transform: translateY(0); }

        @media (max-width: 640px) {
            .navbar { padding: 0 20px; }
            .form-card { padding: 28px 22px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="{% url 'allproducts' %}" class="navbar-brand">🛍️ VideoSnap Shop</a>
        <a href="{% url 'allproducts' %}" class="btn-back">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Back to Products
        </a>
    </nav>

    <div class="main">
        <div class="form-card">
            <div class="form-header">
                <h1>Create <span>Product</span></h1>
                <p>Fill in the details below to add a new product to your shop.</p>
            </div>

            <form action="" method="post" enctype="multipart/form-data" id="createProductForm">
                {% csrf_token %}

                <div class="form-group">
                    <label class="form-label" for="id_name">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M20 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
                        Product Name <span class="required">*</span>
                    </label>
                    <input id="id_name" class="form-control" type="text" name="name" placeholder="e.g. Wireless Headphones" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="id_description">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                        Description
                    </label>
                    <textarea id="id_description" class="form-control" name="description" placeholder="Describe your product features, materials, and specifications…"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label" for="id_price">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                            Price (₹) <span class="required">*</span>
                        </label>
                        <input id="id_price" class="form-control" type="number" step="0.01" min="0" name="price" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="id_stock">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
                            Stock Level
                        </label>
                        <input id="id_stock" class="form-control" type="number" min="0" name="stock" placeholder="0" value="0">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        Product Image
                    </label>
                    <div class="file-upload-wrap">
                        <label class="file-upload-label" for="id_image">
                            <div class="file-upload-icon">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                            </div>
                            <div class="file-upload-text">
                                <strong id="fileLabel">Click to upload image</strong>
                                PNG, JPG, WEBP up to 10MB
                            </div>
                        </label>
                        <input type="file" id="id_image" name="image" accept="image/*">
                    </div>
                    <div class="image-preview" id="imagePreview">
                        <img id="previewImg" src="#" alt="Preview">
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                    Create Product
                </button>
            </form>
        </div>
    </div>

    <script>
        // Image preview on file select
        const fileInput = document.getElementById('id_image');
        const preview  = document.getElementById('imagePreview');
        const previewImg = document.getElementById('previewImg');
        const fileLabel  = document.getElementById('fileLabel');

        fileInput.addEventListener('change', function () {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = e => {
                    previewImg.src = e.target.result;
                    preview.classList.add('visible');
                    fileLabel.textContent = file.name;
                };
                reader.readAsDataURL(file);
            } else {
                preview.classList.remove('visible');
                fileLabel.textContent = 'Click to upload image';
            }
        });
    </script>

</body>
</html>
